<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheers to New Chapters</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Open+Sans:wght@400;600&family=Raleway:wght@400;600&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="heading">
                <p class="cheers">Cheers to</p>
                <h1 class="new">New</h1>
                <p class="chapters">Chapters</p>
            </div>

            <div class="message">
                <p>This season, we're not just celebrating the holidays we're embracing what's next.</p>
                <p>We've got a little surprise to share with you.</p>
            </div>

            <p class="footer-message">
                Thank you for your continued partnership. Here's to a bright and bold New Year!
            </p>
        </div>

        <div class="card">
            <video autoplay loop muted playsinline>
                <source src="./assets/brandbox.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>

</html>
